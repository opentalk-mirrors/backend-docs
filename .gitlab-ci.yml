---

stages:
  - lint
  - clone
  - build
  - container

cache: &mkdocs_cache
  key: ${CI_COMMIT_REF_SLUG}-mkdocs
  paths:
    - .cache
  policy: pull-push

clone:fetch-repos:
  stage: clone
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    - if: $CI_PIPELINE_SOURCE == 'pipeline'
    - if: $CI_COMMIT_TAG != null
  variables:
    REPO_BASE: https://gitlab-ci-token:${CI_JOB_TOKEN}@git.opentalk.dev/
  image: git.opentalk.dev:5050/opentalk/tools/retoki:render-release-series-pages
  artifacts:
    name: $CI_JOB_NAME
    paths:
      - docs
  script:
    - export PATH=/root/.cargo/bin:$PATH
    - just update-all

lint:yaml:
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'
  stage: lint
  image: archlinux:latest
  before_script:
    - pacman -Syy --noconfirm yamllint
  script: yamllint .

lint:markdown:
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'
  stage: lint
  image: registry.gitlab.com/pipeline-components/markdownlint:latest
  script:
    - mdl .

lint:licensing:
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'
  stage: lint
  image:
    name: fsfe/reuse:latest
    entrypoint: ['']
  script:
    - reuse lint

build:
  image:
    name: squidfunk/mkdocs-material:9
    entrypoint: ['']
  variables:
    SITE_URL: ''
  needs:
    - clone:fetch-repos
  cache:
    <<: *mkdocs_cache
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    - if: $CI_PIPELINE_SOURCE == 'pipeline'
    - if: $CI_COMMIT_TAG != null
  stage: build
  artifacts:
    paths:
      - site
  before_script:
    - pip install $(mkdocs get-deps)
  script:
    - mkdocs build

build-offline-archive:
  image:
    name: squidfunk/mkdocs-material:9
    entrypoint: ['']
  variables:
    OFFLINE: 'true'
    SITE_URL: ''
  needs:
    - clone:fetch-repos
  cache:
    <<: *mkdocs_cache
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    - if: $CI_PIPELINE_SOURCE == 'pipeline'
    - if: $CI_COMMIT_TAG != null
  stage: build
  artifacts:
    paths:
      - site
  before_script:
    - pip install $(mkdocs get-deps)
  script:
    - mkdocs build

container:mr:
  needs: [build]
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  stage: container
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: ['']
  script:
    - mkdir -p /kaniko/.docker
    - >
      echo
      "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" >
      /kaniko/.docker/config.json
    # According to https://docs.docker.com/engine/reference/commandline/tag/
    # the tag may contain lowercase and uppercase letters, digits, underscores,
    # periods, and hyphens, so we replace everything else by '_'. It cannot start
    # with a period or hyphen, so we replace those if we find them at the start of a line.
    # It must be no longer than 128 characters, so we truncate it in addition.
    #
    # tr -c means the same as --complement, but busybox tr doesn't have that
    - >
      IMAGE_TAG=$(
          echo -n "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" |
          tr -c '[:alnum:]_.-' '_' |
          sed 's/^[.-]/_/' |
          cut -c -128
      )
    - >
      /kaniko/executor
      --registry-mirror=mirror.gcr.io
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Containerfile
      --cache=true
      --cache-ttl=24h
      --destination $CI_REGISTRY_IMAGE:$IMAGE_TAG
      --force

container:latest:
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    - if: $CI_PIPELINE_SOURCE == 'pipeline' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  stage: container
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: ['']
  script:
    - mkdir -p /kaniko/.docker
    - >
      echo
      "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" >
      /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --registry-mirror=mirror.gcr.io
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Containerfile
      --cache=true
      --cache-ttl=24h
      --destination $CI_REGISTRY_IMAGE:latest
      --force

container:production:
  needs: [container:latest]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  stage: container
  image:
    name: debian:trixie
  before_script:
    - apt-get update && apt-get install -y skopeo ca-certificates
  script:
    - skopeo login --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - skopeo inspect docker://$CI_REGISTRY_IMAGE:latest
    - skopeo copy docker://$CI_REGISTRY_IMAGE:latest docker://$CI_REGISTRY_IMAGE:public
