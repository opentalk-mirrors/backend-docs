---
components:
  schemas:
    signaling_envelope:
      name: Signaling Message Envelope
      description: |
        Common envelope for all messages
      type: object
      required:
        - namespace
        - payload
      additionalProperties: false
      properties:
        namespace:
          type: string
          enum: [media, control, chat]
        payload:
          type: object
      discriminator_:
        propertyName: namespace

    display_name:
      description: Display name of the participant
      type: string

    participant_id:
      description: UUID of the participant
      type: string

    ### Media

    media_session_type:
      description: Type of the transmitted video/audio
      type: string
      enum: [video, screen]

    media_session_state:
      description: The State of parts of this media session.
      type: object
      required:
        - audio
        - video
      additionalProperties: false
      properties:
        audio:
          description: |
            Audio Unmuted?
            false = muted, true = unmuted
          type: boolean
        video:
          description: |
            Video Unmuted?
            false = muted, true = unmuted
          type: boolean

    media_session_info:
      description: Information about this media_session.
      type: object
      required:
        - media_session_type
        - media_session_state
      additionalProperties: false
      properties:
        media_session_type:
          $ref: '#/components/schemas/media_session_type'
        media_session_state:
          $ref: '#/components/schemas/media_session_state'

    trickle_candidate:
      description: An ICE/SDP Tickle Candidate
      type: object
      required:
        - sdpMid
        - sdpMLineIndex
        - candidate
      additionalProperties: false
      properties:
        sdpMid:
          type: string
        sdpMLineIndex:
          type: integer
        candidate:
          $ref: '#/components/schemas/sdp_message'

    sdp_message:
      type: string
      description: |
        The raw SDP message as a string

    targeted_base:
      type: object
      required:
        - target
        - media_session_type
      properties:
        target:
          $ref: '#/components/schemas/participant_id'
        media_session_type:
          $ref: '#/components/schemas/media_session_type'

    targeted_sdp:
      allOf:
        - $ref: '#/components/schemas/targeted_base'
        - type: object
          required:
            - sdp
          properties:
            sdp:
              $ref: '#/components/schemas/sdp_message'


    targeted_candidate:
      allOf:
        - $ref: '#/components/schemas/targeted_base'
        - type: object
          required:
            - candidate
          properties:
            candidate:
              $ref: '#/components/schemas/trickle_candidate'

    source_base:
      type: object
      required:
        - source
        - media_session_type
      properties:
        source:
          $ref: '#/components/schemas/participant_id'
        media_session_type:
          $ref: '#/components/schemas/media_session_type'
        additionalProperties: false

    source_sdp:
      allOf:
        - $ref: '#/components/schemas/source_base'
        - type: object
          required:
            - sdp
          properties:
            sdp:
              $ref: '#/components/schemas/sdp_message'

    source_candidate:
      allOf:
        - $ref: '#/components/schemas/source_base'
        - type: object
          required:
            - candidate
          properties:
            candidate:
              $ref: '#/components/schemas/trickle_candidate'


    associated_media_session:
      type: object
      required:
        - media_session_type
      properties:
        media_session_type:
          $ref: '#/components/schemas/media_session_type'

    participant:
      type: object
      required:
        - id
        - control
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/participant_id'
        control:
          required:
            - display_name
          display_name:
            $ref: '#/components/schemas/display_name'
        media:
          type: object
          propertyNames:
            $ref: '#/components/schemas/media_session_type'
          additionalProperties:
            $ref: '#/components/schemas/media_session_state'
