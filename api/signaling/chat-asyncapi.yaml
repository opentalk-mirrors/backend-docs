---
components:
  messages:
    chat:
      name: 'Sub: Chat Message'
      description: |
        Chat message, send to the current room or privately from an other user.

        Contains the senders participant id, a timestamp, the message content and the scope i.e. private or public.
      payload:
        allOf:
          - $ref: '#/components/schemas/chat_envelope'
          - type: object
            properties:
              payload:
                $ref: '#/components/schemas/chat_message'
      examples:
        - payload:
            namespace: chat
            payload:
              source: 00000000-0000-1111-0000-00000badf00d
              timestamp: 2021-06-24T14:00:11.873753715Z
              content: Hello Bob
              scope: global

    chat_action:
      name: 'Pub: Chat Message'
      description: |
        Chat message, send to the current room or privately to an other user.

        Contains a content field for the message text and an optional target participant if it is a private message.
        The server will send you a [Sub: Chat - Message](<#message-Sub: Chat - Message>) in return.
      payload:
        allOf:
          - $ref: '#/components/schemas/chat_envelope'
          - type: object
            properties:
              payload:
                $ref: '#/components/schemas/chat_action'
      examples:
        - payload:
            namespace: chat
            payload:
              target: 00000000-0000-2222-0000-00000badf00d
              content: Hello Bob
        - payload:
            namespace: chat
            payload:
              content: Hello All

  schemas:
    chat_envelope:
      description: A Chat Message
      type: object
      required:
        - namespace
        - payload
      additionalProperties: false
      properties:
        namespace:
          type: string
          enum: [chat]
        payload:
          type: object
      discriminator_:
        propertyName: namespace

    chat_message:
      description: A Chat Message received from server
      type: object
      required:
        - source
        - timestamp
        - content
        - scope
      additionalProperties: false
      properties:
        source:
          type: string
        timestamp:
          type: string
        content:
          description: The message text
          type: string
        scope:
          type: string
          enum: [private, global]

    chat_action:
      description: A Chat Message send to the server
      type: object
      required:
        - content
      additionalProperties: false
      properties:
        target:
          type: string
        content:
          type: string
