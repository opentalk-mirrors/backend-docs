---
openapi: 3.0.0
info:
  title: K3K Controller Internal API
  description: 'Specifies the endpoints and structure of the K3K Controller Internal API '
  version: '1'
servers:
  - url: /introspection
paths:
  /introspection:
    post:
      summary: The introspection endpoint
      description: |
        Attempts to check the validity of an access or refresh_token.

        Returns whether the token is valid and active.
      tags: [Introspection]
      operationId: introspection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Introspection'
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectResponse'
        500:
          $ref: '#/components/responses/InternalServerError'

components:
  responses:
    InternalServerError:
      description: An interal server error occured.

  schemas:
    Introspection:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
        token_type_hint:
          type: string
          enum: [refresh_token, access_token]
    IntrospectResponse:
      type: object
      additionalProperties: false
      required:
        - active
      properties:
        active:
          type: boolean
        sub:
          description: the token owners id as UUID
          type: string
